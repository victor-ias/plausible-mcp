name = "plausible-mcp"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# nodejs_compat_v2: Node built-ins for the SDK. global_fetch_strictly_public:
# fetch() can only reach public addresses, blocking SSRF.
compatibility_flags = ["nodejs_compat_v2", "global_fetch_strictly_public"]

[vars]
# Only verified users with an @inappstory.com address may use /internal.
ALLOWED_EMAIL_DOMAIN = "inappstory.com"

# No machine/service-token access is enabled.
ALLOWED_SERVICE_TOKEN_IDS = ""

# Expected Workers.dev hostname plus local development.
MCP_ALLOWED_HOSTNAMES = "plausible-mcp.victor-a1c.workers.dev,localhost,127.0.0.1"

# Browser origins allowed to call /internal. Non-browser MCP clients omit Origin.
MCP_ALLOWED_ORIGIN_HOSTNAMES = "chatgpt.com,localhost,127.0.0.1"

# Replace both placeholders after creating the Cloudflare Access application.
# These values are public identifiers, not secrets.
CF_ACCESS_TEAM_DOMAIN = "https://REPLACE_WITH_TEAM.cloudflareaccess.com"
CF_ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD"

# Set the Plausible key out-of-band; never commit it:
#   wrangler secret put PLAUSIBLE_API_KEY
#
# Do not set SENTRY_DSN for the initial deployment. This keeps tool inputs,
# outputs, site IDs, filters, and user identities out of Sentry telemetry.

[dev]
port = 8787

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
