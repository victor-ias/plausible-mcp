name = "plausible-mcp"
main = "src/oauth-worker.ts"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

# nodejs_compat_v2: Node built-ins for the SDK. global_fetch_strictly_public:
# fetch() can only reach public addresses, blocking SSRF.
compatibility_flags = ["nodejs_compat_v2", "global_fetch_strictly_public"]

[vars]
PLAUSIBLE_DEFAULT_SITE_ID = "inappstory.com"

# Only verified Google users with an @inappstory.com address may use /internal.
ALLOWED_EMAIL_DOMAIN = "inappstory.com"

# Public identifier for the Google OAuth Web application.
GOOGLE_CLIENT_ID = "309466244835-b8jmv00rl1n0u05pb2rkdn3gsptd1fol.apps.googleusercontent.com"

# Expected Workers.dev hostname plus local development.
MCP_ALLOWED_HOSTNAMES = "plausible-mcp.victor-a1c.workers.dev,localhost,127.0.0.1"
MCP_PUBLIC_URL = "https://plausible-mcp.victor-a1c.workers.dev"

# Browser origins allowed to call /internal. Non-browser MCP clients omit Origin.
MCP_ALLOWED_ORIGIN_HOSTNAMES = "chatgpt.com,localhost,127.0.0.1"

# Set the Plausible key out-of-band; never commit it:
#   wrangler secret put PLAUSIBLE_API_KEY
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in the Cloudflare dashboard.
# GOOGLE_CLIENT_SECRET and PLAUSIBLE_API_KEY must both use the Secret type.
#
# Do not set SENTRY_DSN for the initial deployment. This keeps tool inputs,
# outputs, site IDs, filters, and user identities out of Sentry telemetry.

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "77b5615627ca434cb3b3fbb34cf29ab0"

[dev]
port = 8787

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
